name: 商机雷达每日邮件

on:
  # 2026-11-27：取消独立 cron。原 '0 6 * * *' 连续多日不触发（schedule 无运行记录），
  # 手动补发又造成同日多封。改为由「每日更新」在发布并回读成功后 dispatch 触发，
  # 日报与页面永远同一份快照，一天一封。手动补发仍走 workflow_dispatch。
  workflow_dispatch:
  repository_dispatch:
    types: [manual-mail, daily-publish]

permissions:
  contents: write

concurrency:
  group: biz-radar-mail
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出正式数据与同一生成入口
        uses: actions/checkout@v4
        with:
          # 2026-11-27 §5.124：与 daily.yml 同型问题——排队后事件 sha 会落后于 main。
          # 邮件必须基于当前 main 的快照，否则发的是排队时刻的旧数据。
          ref: main

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 核对邮件配置并生成快照预览
        working-directory: tools
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          BIZ_OUT: ${{ github.workspace }}
          BIZ_SITE: ${{ github.workspace }}
        run: |
          if [ -z "$MAIL_USER" ] || [ -z "$MAIL_PASS" ]; then
            echo "::error::缺少 MAIL_USER / MAIL_PASS；本任务不假装发送成功"
            exit 1
          fi
          python verify_industry_leads.py
          python send_daily.py --dry --output-dir "$RUNNER_TEMP/mail-preview" --tag 日报

      - name: 实发日报、重大插发与周一报
        working-directory: tools
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          BIZ_OUT: ${{ github.workspace }}
          BIZ_SITE: ${{ github.workspace }}
        run: |
          set -e
          python send_daily.py --tag 日报
          python send_daily.py --spot
          if [ "$(date -u '+%u')" = "1" ]; then
            python send_daily.py --weekly --tag 同事
          fi

      - name: 保存已发状态与送达回执
        run: |
          git config user.name "biz-radar-mail-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tools/raw/mail_state.json tools/raw/mail_delivery_log.jsonl
          if git diff --staged --quiet; then
            echo "状态和回执无变化"
            exit 0
          fi
          # 2026-11-27 §5.124：回执必须推上去，否则 mail_state.json 里「今天已发」的
          #   记录丢了，明天的「同日一封」硬锁就失效（这是今天连发 4 封的直接成因之一）。
          #   只动 mail_state.json / mail_delivery_log.jsonl 两个文件，rebase 冲突面极小，
          #   所以基线变了不拒推，而是 rebase 到最新 main 再推；真冲突才报错交人工。
          base=$(git rev-parse HEAD)
          git commit -m "邮件发送回执 $(date -u '+%Y-%m-%d %H:%M') UTC [skip ci]"
          remote=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$remote" != "$base" ]; then
            echo "基线已前进：${base} → ${remote}，先 rebase 再推回执"
            git pull --rebase origin main || {
              echo "::error::回执 rebase 冲突，请人工处理；本次邮件已发出，state 未落库"
              exit 1
            }
          fi
          git push origin HEAD:main

      - name: 上传邮件预览和发送回执
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-receipt-${{ github.run_id }}
          path: |
            tools/raw/mail_delivery_log.jsonl
            tools/raw/mail_state.json
          if-no-files-found: error
