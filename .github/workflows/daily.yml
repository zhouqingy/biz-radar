name: 商机雷达每日更新

# ══════════════════════════════════════════════════════════════════════
# 2026-10-22 三处修复（对照运行 #2 的实际失败日志）
# ══════════════════════════════════════════════════════════════════════
# 失败原因不是超时，是最后一步 git push 被拒：
#
#   ! [rejected] main -> main (fetch first)
#   error: failed to push some refs
#
# 因为 checkout 用的是 fetch-depth: 1 + 默认浅克隆，等到 30 分钟跑完，
# 本地早已落后于远端（期间我自己 publish_gh.py 按文件推过好几次，
# 每次都是一个新提交）。本地 base 对不上，git 直接拒绝。
#
# 修复三件套：
#   ① fetch-depth: 0        取完整历史，pull --rebase 才有东西可 rebase
#   ② 提交前 pull --rebase   把远端的提交接上，再推
#   ③ 去掉 job 级 55 分钟总超时，改成只给采集步骤限时
#      ——原来「采集近 3 天」占了 30 分钟中的大部分，把 55 分钟的
#      job 额度吃到只剩 25 分钟给后面，一旦网络慢就是整 job 被杀。
#      但采集本身允许失败（continue-on-error），不该让它拖垮整个 job。
# ══════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '20 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 必须是 0（完整历史）。写成 1 的话下面 pull --rebase 会失败：
          # 「fatal: refusing to merge unrelated histories」或直接 rebase 不动。
          fetch-depth: 0

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      # ── 采集段：允许失败 ──────────────────────────────────────────
      # 这一段最慢也最不稳（外部站点限流、超时）。它失败不代表构建失败——
      # 手头已有的数据照样能重建出一版站点，总比整个 job 挂掉、站点停在
      # 昨天要好。所以 continue-on-error + 单独限时。
      - name: 1) 采集近 3 天
        id: crawl
        working-directory: tools
        continue-on-error: true
        timeout-minutes: 30
        run: |
          python collect_v4.py --days 3 --perkw 80 \
            --sites 江苏,浙江,合肥,苏州,常州 --merge

      - name: 2) 详情页扫描
        working-directory: tools
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python scan_detail.py --all --days 7 --limit 120 --sleep 0.1 --workers 8

      - name: 3) 补缺失字段
        working-directory: tools
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python fill_missing.py --limit 80 --sleep 0.1 --workers 8

      # ★ 2026-10-27 新增：省发改委对各地市「十五五」热电联产 / 资源综合利用发电
      #   规划的**批复**。正文是 HTML 纯文本（不用解 PDF），且直接点名企业和项目方向，
      #   比核准更早、比招标公告早 1~3 年，是立项线索层最稀缺的提前量。
      #   产出 raw/early/plan-fgw-latest.json → build_data.py 的 EARLY_SRC 已映射成「立项公示」。
      - name: 3.6) 省发改委热电联产/资源综合利用规划批复
        working-directory: tools
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python crawl_fgw_plan.py

      # ★ 2026-10-27 新增：浙江全省各县市的热电联产规划只在「征求公众意见」公示，
      #   正文不点名企业，干货（谁是热源点业主、装几台炉）全在附件《规划（报批稿）》
      #   PDF 里。plan_pdf_auto.py 下载 PDF → pdftotext → 抽热源点清单，
      #   再由 conv_plan_pdf.py 转成 raw/early/ 入库格式。
      #   ⚠ 依赖 poppler-utils（pdftotext）。ubuntu-latest 镜像自带，装一下是双保险。
      #   ⚠ 已经提取过的 key 会跳过（不覆盖人工校对过的版本），要重跑加 --force。
      - name: 3.7) 规划 PDF 自动提取（热源点清单）
        working-directory: tools
        continue-on-error: true
        timeout-minutes: 25
        run: |
          which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y poppler-utils) || true
          python plan_pdf_auto.py
          python conv_plan_pdf.py

      # ★ 2026-10-28 新增：安徽线。市县级规划站点全是空壳（芜湖不通、马鞍山/安庆栏目
      #   空壳、铜陵栏目里全是人大会议决定、宣城列表 ajax 渲染失败），所以改走省级通道：
      #   省发改委「企业投资项目核准」+「节能审查」+「项目公示」三个栏目，异步列表接口
      #   直接 curl 可拿 JSON。节能审查正文最肥——项目代码（区划码定位城市）、总投资、
      #   装机、技术方案全都写在里面，是项目级一手信息。
      #   产出 raw/early/ah-nygs-latest.json（early='热电规划' → 立项线索层）。
      - name: 3.8) 安徽省发改委·项目核准与节能审查
        working-directory: tools
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python crawl_ah_nygs.py

      # ── 构建段：不允许失败 ────────────────────────────────────────
      # 注意 tools/raw/oversea_extra.json 必须在仓库里（人工补录的巴淡岛等
      # 情报就存在这）。它不在的话 build_web 只打一行 WARN 继续跑，
      # 站点看着正常、那批情报静默消失——比报错更难查。
      - name: 4) 重建数据（第一轮）
        working-directory: tools
        env:
          BIZ_OUT: ${{ github.workspace }}
        run: |
          python build_data.py
          python clean_data.py
          python build_web.py

      - name: 4.5) 生成业主关系图谱
        working-directory: tools
        env:
          BIZ_OUT: ${{ github.workspace }}
        run: python build_owner_graph.py

      - name: 4.6) 重建数据（第二轮）
        working-directory: tools
        env:
          BIZ_OUT: ${{ github.workspace }}
        run: python build_web.py

      # ★ 2026-11-02 新增：规划前瞻模块（一级页签「规划前瞻」）。
      #   为什么单独一步、为什么放最后：
      #     ① 它的输入不是采集来的**公告**，是人工整理好的《江浙沪皖供热规划可做项目清单.xlsx》
      #        （规划正文 PDF 自动提取 → 人工校核后落成这张表）。这张表在仓库根目录下
      #        规划资料-2026-2030/ 里，跟着仓库走，所以 CI 里读得到。
      #     ② 它**不走** build_web.py：那套是招投标流的口径（有招标文件才算），
      #        规划期项目塞进去会把「本库 N 个项目」算成招采记录。
      #     ③ 必须放在 4.6 之后 —— 4.6 会重写 core/org/news 等所有 data.*.js，
      #        虽然它不碰 data.plan.js，但先构建再生成，顺序上更安全，出问题一眼能定位。
      #   ⚠ 允许失败（continue-on-error）：xlsx 没更新 / 格式变动时，
      #     宁可让规划页停在上一次的版本，也不能拖垮整个每日更新。
      - name: 4.7) 生成规划前瞻（独立模块，不进商机库）
        working-directory: tools
        continue-on-error: true
        timeout-minutes: 5
        env:
          BIZ_OUT: ${{ github.workspace }}
          BIZ_SITE: ${{ github.workspace }}
        run: python build_plan_forecast.py

      - name: 5) 检查产物
        run: |
          ls -lh --time-style=+%H:%M data*.js index.html 2>/dev/null | awk '{print $5, $6, $7}'
          # ── 速查快照体检（2026-10-29）────────────────────────────────
          # data.entprobe.js 是「按企业名定向检索」的人工产物，不在采集链里，
          # 也不由 build_web.py 生成 —— 它只在发布清单里被手推。
          # 缺了它页面不报错、不白屏，只是企业画像底部的「全网业绩速查」静默消失。
          # 所以这里必须打一行明确日志，否则出了问题谁都看不出来。
          if [ -f data.entprobe.js ]; then
            echo "速查快照: $(du -h data.entprobe.js | cut -f1) · $(grep -o '"updated":"[^"]*"' data.entprobe.js | head -1)"
          else
            echo "⚠ 速查快照 data.entprobe.js 不在仓库里 —— 线上企业画像会缺「全网业绩速查」这一段"
          fi
          # ── 规划前瞻体检（2026-11-02）────────────────────────────────
          # data.plan.js 由 4.7 生成，那一步是 continue-on-error 的：
          # 生成失败不会中断 job，但会**静默**留下上一次的文件（或者干脆没有）。
          # 这里必须查条数，否则线上「规划前瞻」页签空了都没人知道。
          if [ -f data.plan.js ]; then
            echo "规划前瞻: $(du -h data.plan.js | cut -f1)"
          else
            echo "⚠ 规划前瞻 data.plan.js 不在仓库里 —— 线上「规划前瞻」页签会是空面板"
          fi
          python - <<'PY'
          import json
          try:
              s = open('data.plan.js', encoding='utf-8').read()
              j = json.loads(s[s.index('=') + 1:].strip().rstrip(';'))
              n = j.get('n', 0)
              m = j.get('meta', {})
              print('规划前瞻: %s 条 | 热网类 %s | 主业类 %s | 投资 %s 亿'
                    % (n, m.get('pipe'), m.get('core'), m.get('amt')))
              if n < 100:
                  print('⚠ 规划前瞻条数异常（应 >= 100），检查规划资料-2026-2030/ 下的 xlsx')
          except FileNotFoundError:
              print('data.plan.js 不存在，跳过规划校验')
          PY
          python - <<'PY'
          import json, sys
          s = open('data.core.js', encoding='utf-8').read()
          m = json.loads(s[s.index('=') + 1:].strip().rstrip(';'))
          meta = m.get('meta', {})
          total = meta.get('total', 0)
          print('总条数: %s | 数据日期: %s | 金额覆盖: %s'
                % (total, meta.get('dataAsOf'), meta.get('withAmt')))
          if total < 1000:
              print('条数异常，疑似采集失败，本次不提交')
              sys.exit(1)
          # 海外动态也检查一下：这批是人工维护的，被冲掉说明 raw 源没读到
          try:
              n = open('data.news.js', encoding='utf-8').read()
              j = json.loads(n[n.index('=') + 1:].strip().rstrip(';'))
              ov = len(j.get('overseas') or [])
              print('海外动态: %s 条' % ov)
              if ov < 80:
                  print('海外动态异常（应 >= 80），疑似 raw/oversea_extra.json 未读到')
                  sys.exit(1)
          except FileNotFoundError:
              print('data.news.js 不存在，跳过海外校验')
          print('自检通过')
          PY
          # 口径自查：meta（顶部 KPI）必须和列表逐项对得上，bizTop 标签必须在
          # 前端 SEG_NAME 里有定义。2026-11-04 就是这里漏了才出「已公示金额 483 条
          # / 列表只有 460 条」和「能源清洁高效利用」这种前端没有的老词。
          python check_meta.py

      # ── 提交段：核心修复 ─────────────────────────────────────────
      - name: 6) 提交并推送
        run: |
          git config user.name  "biz-radar-bot"
          git config user.email "bot@users.noreply.github.com"

          # 只提交站点产物。:!tools 排除工具目录——脚本不该被机器人的
          # 自动更新覆盖掉（否则我这边改一次就被冲一次）。
          # merged.snapshot.json 是两个「不采集」工作流（metals / digest）的构建输入，
          # 必须跟数据一起刷新，否则它们永远拿旧快照重建、把数据回滚。
          git add -A '*.js' '*.html' 'merged.snapshot.json' ':!tools'

          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi

          git commit -m "自动更新 $(date -u '+%Y-%m-%d %H:%M') UTC"

          # 把远端的新提交接上再推。用 rebase 不用 merge：
          # 产物文件与远端冲突时 rebase 保本地（我们的这版是刚构建的，更新）。
          git -c rebase.autoStash=true pull --rebase --strategy-option=ours origin main || {
            echo "rebase 失败，改用合并策略"
            git rebase --abort 2>/dev/null || true
            git pull --no-rebase --strategy-option=ours origin main
          }

          # 推两次：第一次可能又被抢先，重试一次基本能过
          for i in 1 2; do
            if git push; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "第 $i 次推送被拒，拉取后重试"
            git pull --rebase --strategy-option=ours origin main || true
            sleep 5
          done
          echo "两次推送均失败"
          exit 1
