name: 商机雷达每日更新

# 每天北京时间 07:20 自动跑：采集 → 补字段 → 清洗 → 构建 → 提交
# 提交后 Pages 自动重新部署，网址不变
# cron 是 UTC 时间：07:20 北京 = 前一日 23:20 UTC

on:
  schedule:
    - cron: '20 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 1) 采集近 3 天
        id: crawl
        working-directory: tools
        continue-on-error: true
        run: |
          python collect_v4.py --days 3 --perkw 150 \
            --sites 江苏,浙江,合肥,苏州,常州 --merge

      - name: 2) 详情页扫描
        working-directory: tools
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python scan_detail.py --all --days 7 --limit 200 --sleep 0.12

      - name: 3) 补缺失字段
        working-directory: tools
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python fill_missing.py --limit 100 --sleep 0.2

      - name: 4) 重建数据（第一轮）
        working-directory: tools
        env:
          BIZ_OUT: ${{ github.workspace }}
        run: |
          python build_data.py
          python clean_data.py
          python build_web.py

      - name: 4.5) 生成业主关系图谱
        working-directory: tools
        env:
          BIZ_OUT: ${{ github.workspace }}
        run: |
          python build_owner_graph.py

      - name: 4.6) 重建数据（第二轮，把图谱并进去）
        working-directory: tools
        env:
          BIZ_OUT: ${{ github.workspace }}
        run: |
          python build_web.py

      - name: 5) 检查产物
        run: |
          ls -lh --time-style=+%H:%M data*.js index.html 2>/dev/null | awk '{print $5, $6, $7}'
          python - <<'PY'
          import json, os, sys
          s = open('data.core.js', encoding='utf-8').read()
          m = json.loads(s[s.index('=') + 1:].strip().rstrip(';'))
          meta = m.get('meta', {})
          total = meta.get('total', 0)
          print('总条数: %s | 数据日期: %s | 金额覆盖: %s'
                % (total, meta.get('dataAsOf'), meta.get('withAmt')))
          if total < 1000:
              print('条数异常，疑似采集失败，本次不提交')
              sys.exit(1)
          print('自检通过')
          PY

      - name: 6) 提交并推送
        run: |
          git config user.name  "biz-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A '*.js' '*.html' ':!tools'
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "自动更新 $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
