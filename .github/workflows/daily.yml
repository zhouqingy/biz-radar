name: 商机雷达每日更新

on:
  schedule:
    - cron: '20 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 必须 0（完整历史）。写 1 的话下面的 pull --rebase 接不上远端
          fetch-depth: 0

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: 1) 采集近 3 天
        id: crawl
        working-directory: tools
        continue-on-error: true
        timeout-minutes: 30
        run: |
          python collect_v4.py --days 3 --perkw 80 \
            --sites 江苏,浙江,合肥,苏州,常州 --merge

      - name: 2) 详情页扫描
        working-directory: tools
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python scan_detail.py --all --days 7 --limit 120 --sleep 0.1 --workers 8

      - name: 3) 补缺失字段
        working-directory: tools
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python fill_missing.py --limit 80 --sleep 0.1 --workers 8
      - name: 3.1) 南通市站全生命周期（多城市模板）
        working-directory: tools
        continue-on-error: true
        timeout-minutes: 20
        run: python crawl_city_lifecycle.py --days 3 --detail 1

      - name: 3.2) 安徽省站全生命周期（列表翻页 + 立项批复）
        working-directory: tools
        continue-on-error: true
        timeout-minutes: 30
        run: python crawl_ah.py --backfill-days 3 --approvals 1

      - name: 3.3) 江苏省站全生命周期（13 市，建工+水利+交通+政采）
        working-directory: tools
        continue-on-error: true
        timeout-minutes: 30
        run: python crawl_js_prov.py --backfill-days 3

      - name: 3.4) 名单命中详情补抓（评标情报）
        working-directory: tools
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python fetch_js_detail.py --limit 120 --sleep 0.3
          python fetch_ah_detail.py --limit 40

      - name: 4) 重建数据（第一轮）
        working-directory: tools
        env:
          BIZ_OUT: ${{ github.workspace }}
        run: |
          python build_data.py
          python clean_data.py
          python build_web.py

      - name: 4.5) 生成业主关系图谱
        working-directory: tools
        env:
          BIZ_OUT: ${{ github.workspace }}
        run: python build_owner_graph.py

      - name: 4.6) 重建数据（第二轮）
        working-directory: tools
        env:
          BIZ_OUT: ${{ github.workspace }}
        run: python build_web.py

      - name: 5) 检查产物
        run: |
          ls -lh --time-style=+%H:%M data*.js index.html 2>/dev/null | awk '{print $5, $6, $7}'
          python - <<'PY'
          import json, sys
          s = open('data.core.js', encoding='utf-8').read()
          m = json.loads(s[s.index('=') + 1:].strip().rstrip(';'))
          meta = m.get('meta', {})
          total = meta.get('total', 0)
          print('总条数: %s | 数据日期: %s | 金额覆盖: %s'
                % (total, meta.get('dataAsOf'), meta.get('withAmt')))
          if total < 1000:
              print('条数异常，疑似采集失败，本次不提交')
              sys.exit(1)
          try:
              n = open('data.news.js', encoding='utf-8').read()
              j = json.loads(n[n.index('=') + 1:].strip().rstrip(';'))
              ov = len(j.get('overseas') or [])
              print('海外动态: %s 条' % ov)
              if ov < 80:
                  print('海外动态异常（应 >= 80），疑似 raw/oversea_extra.json 未读到')
                  sys.exit(1)
          except FileNotFoundError:
              print('data.news.js 不存在，跳过海外校验')
          print('自检通过')
          PY

      - name: 6) 提交并推送
        run: |
          git config user.name  "biz-radar-bot"
          git config user.email "bot@users.noreply.github.com"

          git add -A '*.js' '*.html' ':!tools'

          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi

          git commit -m "自动更新 $(date -u '+%Y-%m-%d %H:%M') UTC"

          git -c rebase.autoStash=true pull --rebase --strategy-option=ours origin main || {
            echo "rebase 失败，改用合并策略"
            git rebase --abort 2>/dev/null || true
            git pull --no-rebase --strategy-option=ours origin main
          }

          for i in 1 2; do
            if git push; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "第 $i 次推送被拒，拉取后重试"
            git pull --rebase --strategy-option=ours origin main || true
            sleep 5
          done
          echo "两次推送均失败"
          exit 1
