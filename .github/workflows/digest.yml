name: 情报精选刷新（每周一）

# 2026-11-04 新增
# ── 搬的是什么 ──────────────────────────────────────────────
# WorkBuddy 任务「商机雷达 · 情报精选刷新」（每周一 10:30）里的**自动部分**：
#   竞对官网新闻抓取 → 与人工投喂的微信深度稿合并去重 → raw/digest.json → 重建页面
#
# ── 微信稿为什么不在这里抓 ───────────────────────────────────
# 搜狗微信源 2026-10-15 实测全线失效（antispider 全拦），mine_wechat.py 依赖的
# node 脚本也不在仓库里。所以微信这条保留「人工投喂」：
#   本地跑 tools/wechat_digest.py "<链接1>" "<链接2>" → 写 raw/wechat_digest.json
#   → 提交进仓库 → 本流程每周一自动把它和新抓到的竞对新闻合并。
# 好处是：人只负责挑链接，合并去重和发布全自动，不用每次都动 WorkBuddy。
#
# ── 为什么只更新 digest 字段（2026-11-26 P0）─────────────────
# 旧流程用 merged.snapshot.json 跑 build_web.py，会把其他模块回滚到快照版。
# 现在 merge_digest.py 同时更新 data.js / data.news.js 的 digest 字段，其余字段断言不变；
# 自检再核对 raw 与两个产物同源，并通过 release_manifest.py 做日期和数量防回退。

on:
  schedule:
    - cron: '30 2 * * 1'      # 每周一 10:30 北京 = 02:30 UTC
  workflow_dispatch:
  # 2026-11-04：加 push 触发。原因很实际 —— 无 workflow scope 的 token 不能
  # dispatch，只能在网页上点；而「Re-run all jobs」用的是**当时那次运行的旧 commit**，
  # 所以修完代码再点重跑，跑的仍是坏的那版，看起来像「改了还是失败」。
  # 改脚本或改这个工作流本身时会自动在新 commit 上跑一次，省掉这一步人工。
  push:
    paths:
      - '.github/workflows/digest.yml'   # 改工作流本身也要跑一次，否则「修完重跑还是失败」
      - 'tools/merge_digest.py'
      - 'tools/mine_rival_news.py'
      - 'tools/release_manifest.py'

permissions:
  contents: write

# 与 daily / metals / guard-index 共用发布锁，避免共享产物并发提交。
concurrency:
  group: biz-radar-release
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: 1) 抓竞对官网新闻
        id: rival
        working-directory: tools
        timeout-minutes: 30
        continue-on-error: true     # 抓不到就沿用上一版 raw/rival_news.json，不要整个 job 挂掉
        run: |
          # 读 data.js 里的 competitors 列表，逐家抓官网新闻页，按事件词/主业词/海外词分级
          python mine_rival_news.py

      - name: 2) 合并去重（只更新 digest 字段）
        working-directory: tools
        env:
          BIZ_OUT: ${{ github.workspace }}
        run: |
          # 读 raw/rival_news.json + raw/wechat_digest.json
          # 相似度 0.72 去重 → 写 raw/digest.json
          python merge_digest.py

      # P0：这里不再调用 build_web.py。merge_digest.py 已同时、且仅更新
      # data.js / data.news.js 的 digest 字段，避免拿 merged.snapshot.json 回写其他模块。

      - name: 4) 自检与防回退清单
        env:
          BIZ_SOURCE_HEALTH: rival=${{ steps.rival.outcome }}
        run: |
          python - <<'PY'
          import json, sys, time
          today = time.strftime('%Y-%m-%d')
          raw = json.load(open('tools/raw/digest.json', encoding='utf-8'))
          items = raw.get('items') or []
          print('raw/digest.json  %d 条  更新于 %s' % (len(items), raw.get('updated')))
          if not items:
              print('❌ digest 为空，本次不提交'); sys.exit(1)

          s = open('data.js', encoding='utf-8').read()
          d = json.loads(s[s.index('{'):s.rindex('}') + 1])
          dg = d.get('digest') or {}
          print('data.js digest   %d 条  更新于 %s' % (len(dg.get('items') or []), dg.get('updated')))
          if len(dg.get('items') or []) < 20:
              print('❌ 页面 digest 少于 20 条，疑似被清空，本次不提交'); sys.exit(1)
          ns = open('data.news.js', encoding='utf-8').read()
          nd = json.loads(ns[ns.index('{'):ns.rindex('}') + 1]).get('digest') or {}
          assert nd == dg, 'data.news.js 与 data.js 的 digest 不一致'
          print('✅ data.js / data.news.js / raw digest 同源')
          PY
          python tools/release_manifest.py build --root "$GITHUB_WORKSPACE" --scope digest

      - name: 5) 提交并推送
        run: |
          git config user.name  "biz-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.js data.news.js release-manifest.json tools/raw/digest.json tools/raw/rival_news.json
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "情报精选 $(date -u '+%Y-%m-%d') 刷新"
          # 不用 ours 合并新提交；基线变化即停止，重新在最新 main 上构建。
          remote=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$remote" != "${GITHUB_SHA}" ]; then
            echo "::error::发布基线已变化：${GITHUB_SHA} → ${remote}；本次不推，请重跑"
            exit 1
          fi
          git push origin HEAD:main

      - name: 5.5) 仓库与 Pages 回读
        run: |
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$(git rev-parse HEAD)"
          python tools/release_manifest.py verify-online --root "$GITHUB_WORKSPACE" --scope digest

      - name: 6) 结果摘要
        if: always()
        run: |
          echo "### 情报精选刷新" >> $GITHUB_STEP_SUMMARY
          echo "| 项 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 竞对官网抓取 | ${{ steps.rival.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 合并 / 自检 / 发布 | 见上方各步 |" >> $GITHUB_STEP_SUMMARY

      - name: 7) 最终业务健康闸门
        if: always()
        run: |
          if [ "${{ steps.rival.outcome }}" = "failure" ]; then
            echo "::error::竞对官网抓取失败；已有精选可按守卫发布，但本任务不得以 success 收尾"
            exit 1
          fi
