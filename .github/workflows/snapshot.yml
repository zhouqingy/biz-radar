# 商机雷达 V4 · GitHub Pages 静态快照「只读重打包」
#
# 与「商机雷达每日更新」(daily.yml) 完全解耦：
#   - 本工作流不采集、不改 data*.js、不跑 build_data.py / build_web.py、
#     ！不调用 biz_rules 的任何判定函数；
#   - 只读解析仓库里**已筛好的** data*.js，把 §6 契约所需全量数据重烤成 v4/api/*.json；
#   - 数据包没变 → 产物逐字节一致 → git diff --quiet → 跳过提交 → 绿灯；
#   - 数据包一旦被采集链路更新 → 第二天自动跟上，Pages 站随之刷新。
#
# 这样「数据新鲜度卡口」的红叉只留在 daily.yml 当采集健康告警，
# 不再把「站点的自动更新」一起堵死（2026-11-06 用户指出的问题）。
name: 商机雷达 V4 静态快照（只读重打包）
on:
  schedule:
    # 北京 16:40，排在 daily.yml 的 08:05 UTC（北京 16:05）之后
    - cron: '40 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v4-snapshot
  cancel-in-progress: true
jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 从已筛好的 data*.js 只读重烤快照
        run: python3.11 tools/build_snapshot.py --data-dir . --out v4
      - name: 提交（数据未变就跳过，保证绿灯）
        run: |
          git config user.name  "biz-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add v4/api/*.json
          if git diff --staged --quiet; then
            echo "数据包未变化，快照逐字节一致，跳过提交（绿灯空转）"
            exit 0
          fi
          git commit -m "V4 静态快照只读重打包 $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase --strategy-option=ours origin main || true
          git push
