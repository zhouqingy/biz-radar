name: 金属行情刷新（交易日）

# 2026-11-04 新增
# ── 为什么搬进 Action ────────────────────────────────────────
# 原来靠 WorkBuddy 定时任务「商机雷达 · 每日收盘行情刷新」（每交易日 16:05）跑，
# 那个任务依赖沙箱在线，且推送时会 pull 网盘快照，历史上把 index.html 推回过老版
# （见 guard-index.yml 头部注释）。搬进来后行情完全在仓库内闭环，不碰页面。
#
# ── 两个产出，缺一不可 ──────────────────────────────────────
#   data.metalhist.js  历史曲线（新浪期货日K，20 年全历史）
#   data.core.js       当日行情 + 涨跌幅（refresh_metals_core.py 只替换 metals 字段，
#                      复用同一 fetch_metals 抓取与缓存逻辑，不重建其他业务模块）
# 只跑前者的话，页面「今日行情」那排数字会一直停在旧日期。
#
# ── 时间 ────────────────────────────────────────────────────
# 16:05 北京 = 08:05 UTC。国内商品期货 15:00 收盘，夜盘 21:00 才开，
# 所以 16:05 拿到的是当日收盘结算价，不受夜盘干扰。
# 周末不跑（周六只有凌晨 2:30 的结算，没有意义）。

on:
  schedule:
    - cron: '5 8 * * 1-5'
  workflow_dispatch:
  # 2026-11-04：加 push 触发。原因很实际 —— 无 workflow scope 的 token 不能
  # dispatch，只能在网页上点；而「Re-run all jobs」用的是**当时那次运行的旧 commit**，
  # 所以修完代码再点重跑，跑的仍是坏的那版，看起来像「改了还是失败」。
  # 改脚本或改这个工作流本身时会自动在新 commit 上跑一次，省掉这一步人工。
  push:
    paths:
      - '.github/workflows/metals.yml'   # 改工作流本身也要跑一次，否则「修完重跑还是失败」
      - 'tools/gen_metal_hist.py'
      - 'tools/refresh_metals_core.py'
      - 'tools/release_manifest.py'

permissions:
  contents: write

# 与 daily / digest / guard-index 共用发布锁，避免整站产物互相覆盖。
concurrency:
  group: biz-radar-release
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 下面要 pull --rebase，浅克隆会失败

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: 1) 抓历史日 K → data.metalhist.js
        id: hist
        # 新浪封 Actions 机房 IP 是常态（§5.68）；失败就跳过历史重建，
        # 保留仓库里上一次推送的版本，不让它挡住当日行情重建（§5.110）。
        continue-on-error: true
        working-directory: tools
        env:
          BIZ_OUT: ${{ github.workspace }}
          BIZ_SITE: ${{ github.workspace }}
        timeout-minutes: 12
        run: |
          # 脚本内部：逐品种 curl 新浪接口，全部失败时不覆盖线上文件、返回码 1。
          # 这里不 continue-on-error —— 历史文件是纯附加产物，抓不到就没必要继续，
          # 但要先把失败原因留在日志里，所以用 || 兜一下再 fail。
          python gen_metal_hist.py

      - name: 2) 重建当日行情 → data.core.js
        id: core
        working-directory: tools
        env:
          BIZ_OUT: ${{ github.workspace }}
        timeout-minutes: 12
        run: |
          # P0：只替换 data.core.js 的 metals 字段；其余 meta / chunks 原样保留。
          # 不再读取 merged.snapshot.json，也不再调用 build_web.py 重建整站。
          python refresh_metals_core.py

      - name: 2.8) 固定本次交易日
        id: date
        run: echo "today=$(date -u '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: 3) 自检与防回退清单
        env:
          BIZ_EXPECT_DATE: ${{ steps.date.outputs.today }}
          BIZ_SOURCE_HEALTH: history=${{ steps.hist.outcome }}
        run: |
          python - <<'PY'
          import json, re, sys, os

          # ① 历史文件：updated 必须是今天，否则说明抓取用的是缓存/失败
          s = open('data.metalhist.js', encoding='utf-8').read()
          j = json.loads(s[s.index('{'):s.rindex('}') + 1])
          print('行情历史 updated=%s  品种=%d' % (j.get('updated'), len(j.get('s', {}))))
          if len(j.get('s', {})) < 10:
              print('❌ 品种不足 10 个，疑似抓取失败，本次不提交'); sys.exit(1)

          # ② 当日行情：data.core.js 里 metals 非空且日期是今天
          c = open('data.core.js', encoding='utf-8').read()
          m = json.loads(c[c.index('=') + 1:].strip().rstrip(';'))
          metals = m.get('metals') or {}
          items = metals.get('items') or (metals if isinstance(metals, list) else [])
          print('当日行情 %d 个品种，日期=%s'
                % (len(items), metals.get('updated') if isinstance(metals, dict) else '?'))
          if not items:
              print('❌ 当日行情为空，本次不提交'); sys.exit(1)
          print('✅ 自检通过')
          PY
          # 当日价格与所有历史端点必须同为本次交易日；回退缓存会在这里判红。
          python tools/release_manifest.py build --root "$GITHUB_WORKSPACE" --scope metals

      - name: 4) 提交并推送
        run: |
          git config user.name  "biz-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.metalhist.js data.core.js release-manifest.json \
                  tools/raw/metals_cache.json tools/raw/spot_cache.json tools/raw/spot_hist.json
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "金属行情 $(date -u '+%Y-%m-%d') 收盘更新"

          # 本流程已无 build_web 副作用。若基线变化，明确停止，不用 ours 覆盖新提交。
          remote=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$remote" != "${GITHUB_SHA}" ]; then
            echo "::error::发布基线已变化：${GITHUB_SHA} → ${remote}；本次不推，请重跑"
            exit 1
          fi
          git push origin HEAD:main

      - name: 4.5) 仓库与 Pages 回读
        run: |
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$(git rev-parse HEAD)"
          python tools/release_manifest.py verify-online --root "$GITHUB_WORKSPACE" --scope metals

      - name: 5) 结果摘要
        if: always()
        run: |
          echo "### 金属行情刷新" >> $GITHUB_STEP_SUMMARY
          echo "| 项 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 历史日K | ${{ steps.hist.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 当日行情 | ${{ steps.core.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 日期 | $(date -u '+%Y-%m-%d') |" >> $GITHUB_STEP_SUMMARY

      - name: 6) 最终业务健康闸门
        if: always()
        run: |
          if [ "${{ steps.hist.outcome }}" = "failure" ]; then
            echo "::error::历史行情抓取失败；当日行情可能已更新，但本任务不得以 success 收尾"
            exit 1
          fi
